        /**
         * INDEXEDDB STORAGE ENGINE
         */
        class LocalDB {
            constructor() {
                this.dbName = 'AgriTech12_DB';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        const stores = [
                            'users', 'classes', 'students', 'topics', 
                            'questions', 'exams', 'assignments', 
                            'attempts', 'results', 'settings'
                        ];
                        stores.forEach(store => {
                            if (!db.objectStoreNames.contains(store)) {
                                db.createObjectStore(store, { keyPath: 'id' });
                            }
                        });
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };

                    request.onerror = (e) => reject('IndexedDB Init Error: ' + e.target.error);
                });
            }

            async getAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }

            async get(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async put(storeName, item) {
                return new Promise((resolve, reject) => {
                    if (!item.id) item.id = 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    item.updatedAt = new Date().toISOString();
                    if (!item.createdAt) item.createdAt = item.updatedAt;

                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(item);
                    req.onsuccess = () => {
                        app.showSaveIndicator();
                        resolve(item);
                    };
                    req.onerror = () => reject(req.error);
                });
            }

            async delete(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.delete(id);
                    req.onsuccess = () => {
                        app.showSaveIndicator();
                        resolve(true);
                    };
                    req.onerror = () => reject(req.error);
                });
            }

            async clearStore(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.clear();
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }
        }

        class AgriApp {
            constructor() {
                this.db = new LocalDB();
                this.currentUser = { role: 'teacher', name: 'Giáo viên Demo', id: 'teacher_main' };
                this.currentView = 'login';
                this.selectedClassId = 'class_12a1';
                this.audioEnabled = true;
                this.activeExamSession = null;
                this.timerInterval = null;
            }

            async start() {
                await this.db.init();
                await this.checkSeedData();
                this.setupEventListeners();
                this.checkOnlineStatus();
                this.render();
            }

            async checkSeedData() {
                const classes = await this.db.getAll('classes');
                if (classes.length === 0) {
                    console.log('Seeding initial agricultural technology data...');
                    for (let c of SEED_DATA.classes) await this.db.put('classes', c);
                    for (let s of SEED_DATA.students) await this.db.put('students', s);
                    for (let t of SEED_DATA.topics) await this.db.put('topics', t);
                    for (let q of SEED_DATA.questions) await this.db.put('questions', q);
                    for (let e of SEED_DATA.exams) await this.db.put('exams', e);
                    for (let a of SEED_DATA.assignments) await this.db.put('assignments', a);
                }
            }

            checkOnlineStatus() {
                const updateStatus = () => {
                    const isOnline = navigator.onLine;
                    const el = document.getElementById('network-status');
                    if (el) {
                        el.innerText = isOnline ? 'Đang trực tuyến' : 'Đang ngoại tuyến (Offline)';
                        el.parentElement.className = isOnline 
                            ? 'bg-emerald-700/80 px-2 py-0.5 rounded text-[11px] font-semibold flex items-center gap-1'
                            : 'bg-amber-600/90 px-2 py-0.5 rounded text-[11px] font-semibold flex items-center gap-1 animate-pulse';
                    }
                };
                window.addEventListener('online', updateStatus);
                window.addEventListener('offline', updateStatus);
                updateStatus();
            }

            showSaveIndicator() {
                const ind = document.getElementById('save-indicator');
                if (ind) {
                    ind.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...';
                    setTimeout(() => {
                        ind.innerHTML = '<i class="fa-solid fa-check"></i> Đã lưu local';
                    }, 400);
                }
            }

            toast(msg, type = 'success') {
                const container = document.getElementById('toast-container');
                if (!container) return;

                const toast = document.createElement('div');
                const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-sky-600';
                const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle';

                toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center justify-between text-sm transition-all duration-300 transform translate-y-2 pointer-events-auto opacity-95`;
                toast.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid ${icon}"></i>
                        <span>${msg}</span>
                    </div>
                    <button onclick="this.parentElement.remove()" class="ml-4 opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
                `;

                container.appendChild(toast);
                this.playSound(type === 'success' ? 'pop' : 'alert');

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            playSound(type) {
                if (!this.audioEnabled) return;
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    if (type === 'pop') {
                        osc.frequency.setValueAtTime(440, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.1);
                    } else if (type === 'alert') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(300, ctx.currentTime);
                        osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                        gain.gain.setValueAtTime(0.15, ctx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    }
                } catch(e) {}
            }

                    const scores = classes.map(c => {
                        const stds = attempts.filter(a => a.classId === c.id);
                        if (stds.length === 0) return 7.2; // default demo mean
                        return (stds.reduce((sum, a) => sum + a.score, 0) / stds.length).toFixed(1);
                    });

                    new Chart(ctx1, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Điểm trung bình',
                                data: scores,
                                backgroundColor: '#22c55e',
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { y: { min: 0, max: 10 } }
                        }
                    });

                // Pass Rate Doughnut Chart

            handleExcelParsed(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                        if (jsonData.length === 0) {
                            this.toast('File Excel không có dữ liệu!', 'error');
                            return;
                        }

                        const classes = await this.db.getAll('classes');
                        const defaultClassId = classes[0]?.id || 'class_12a1';

                        let count = 0;
                        for (let row of jsonData) {
                            const name = row['Họ tên'] || row['Ho va ten'] || row['Họ và tên'] || row['Name'];
                            if (name) {
                                await this.db.put('students', {
                                    id: 'std_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                                    name: name,
                                    studentCode: row['Mã HS'] || row['Ma HS'] || ('HS' + Math.floor(1000 + Math.random() * 9000)),
                                    gender: row['Giới tính'] || 'Nam',
                                    classId: defaultClassId,
                                    notes: 'Nhập từ file Excel'
                                });
                                count++;
                            }
                        }

                        this.toast(`Đã nhập thành công ${count} học sinh!`);
                        document.getElementById('modal-container').classList.add('hidden');
                        this.render();
                    } catch (err) {
                        this.toast('Không thể đọc file Excel. Vui lòng kiểm tra định dạng!', 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            }

                    </div>

            handleDocxParsed(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const arrayBuffer = evt.target.result;
                    mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                        .then(async (result) => {
                            const text = result.value;
                            if (!text || text.trim().length === 0) {
                                this.toast('File Word không chứa văn bản!', 'error');
                                return;
                            }

                            // Auto create a topic from parsed document
                            const firstLine = text.split('\n')[0] || 'Chuyên đề Word Mới';
                            await this.db.put('topics', {
                                id: 'topic_' + Date.now(),
                                title: firstLine.substring(0, 60),
                                description: text.substring(0, 200) + '...'
                            });

                            this.toast('Đã trích xuất và lưu chuyên đề từ Word thành công!');
                            document.getElementById('modal-container').classList.add('hidden');
                            this.render();
                        })
                        .catch(() => this.toast('Lỗi khi đọc file Word (.docx)', 'error'));
                };
                reader.readAsArrayBuffer(file);
            }

                const ex = {

            async exportBackupJSON() {
                const stores = ['classes', 'students', 'topics', 'questions', 'exams', 'assignments', 'attempts'];
                const backup = {};

                for (let s of stores) {
                    backup[s] = await this.db.getAll(s);
                }

                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_cong_nghe_12_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                this.toast('Đã xuất file sao lưu JSON thành công!');
            }

            async importBackupJSON(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (confirm('Khôi phục backup sẽ ghi đè dữ liệu hiện tại. Bạn muốn tiếp tục?')) {
                            for (let storeName in data) {
                                await this.db.clearStore(storeName);
                                for (let item of data[storeName]) {
                                    await this.db.put(storeName, item);
                                }
                            }
                            this.toast('Đã khôi phục dữ liệu sao lưu thành công!');
                            this.render();
                        }
                    } catch (err) {
                        this.toast('File backup JSON không hợp lệ!', 'error');
                    }
                };
                reader.readAsText(file);
            }

            async startExamSession(examId) {
                const exam = await this.db.get('exams', examId);
                const questions = [];

                for (let qId of exam.questionIds) {
                    const q = await this.db.get('questions', qId);
                    if (q) questions.push(q);
                }

                this.activeExamSession = {
                    exam: exam,
                    questions: questions,
                    userAnswers: {},
                    startTime: Date.now(),
                    timeRemainingSeconds: exam.timeLimit * 60,
                    isSubmitted: false

                this.navigateTo('student_take_exam');

                this.timerInterval = setInterval(() => {
                    if (!this.activeExamSession || this.activeExamSession.isSubmitted) {
                        clearInterval(this.timerInterval);
                        return;
                    }

                    this.activeExamSession.timeRemainingSeconds--;
                    const secs = this.activeExamSession.timeRemainingSeconds;

                    const timerEl = document.getElementById('exam-timer-text');
                    if (timerEl) {
                        const m = Math.floor(secs / 60);
                        const s = secs % 60;
                        timerEl.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
                    }

                    if (secs <= 0) {
                        clearInterval(this.timerInterval);
                        this.toast('Đã hết thời gian làm bài! Hệ thống tự động nộp bài.', 'error');
                        this.submitActiveExam();
                    }
                }, 1000);
            }

            async confirmSubmitExam() {
                if (confirm('Bạn có chắc chắn muốn nộp bài thi?')) {
                    await this.submitActiveExam();
                }
            }

            async submitActiveExam() {
                if (!this.activeExamSession) return;
                this.activeExamSession.isSubmitted = true;
                if (this.timerInterval) clearInterval(this.timerInterval);

                const sess = this.activeExamSession;
                let correctCount = 0;

                sess.questions.forEach(q => {
                    if (sess.userAnswers[q.id] === q.correctAnswer) {
                        correctCount++;
                    }
                });

                const totalQ = sess.questions.length;
                const score = totalQ > 0 ? (correctCount / totalQ) * 10 : 0;

                const attemptRecord = {
                    id: 'attempt_' + Date.now(),
                    studentId: this.currentUser.id,
                    examId: sess.exam.id,
                    examTitle: sess.exam.title,
                    score: score,
                    correctCount: correctCount,
                    totalQuestions: totalQ,
                    submittedAt: new Date().toISOString(),
                    userAnswers: sess.userAnswers
                };

                await this.db.put('attempts', attemptRecord);
                
                if (score >= 8.0 && typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }

                this.toast(`Đã nộp bài! Điểm số của bạn: ${score.toFixed(1)} / 10`);
                this.navigateTo('student_results', { attempt: attemptRecord, questions: sess.questions });
            }

            async renderStudentResultsView() {
                const params = this.viewParams || {};
                const attempt = params.attempt;
                const questions = params.questions || [];

                if (!attempt) return '<div class="p-6">Không tìm thấy thông tin kết quả bài làm.</div>';

                return `
                    <div class="space-y-6 max-w-2xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center space-y-3">
                            <div class="w-20 h-20 rounded-full ${attempt.score >= 5 ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} mx-auto flex items-center justify-center font-bold text-3xl">
                                ${attempt.score.toFixed(1)}
                            </div>
                            <h2 class="font-bold text-xl text-slate-800">🎉 Kết Quả Bài Làm Của Bạn</h2>
                            <p class="text-xs text-slate-500">Đúng ${attempt.correctCount} / ${attempt.totalQuestions} câu trắc nghiệm</p>
                        </div>

                        <!-- Review Answers -->
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="font-bold text-sm text-slate-800">📝 Chi Tiết Câu Hỏi & Đáp Án</h3>
                            <div class="space-y-3">
                                ${questions.map((q, idx) => {
                                    const userAns = attempt.userAnswers[q.id];
                                    const isCorrect = userAns === q.correctAnswer;
                                    return `
                                        <div class="p-3 rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/50' : 'border-rose-200 bg-rose-50/50'} text-xs space-y-1">
                                            <p class="font-bold text-slate-800">Câu ${idx + 1}: ${q.content}</p>
                                            <p class="text-slate-600">Lựa chọn của bạn: <strong>${userAns || 'Bỏ trống'}</strong></p>
                                            <p class="text-emerald-700 font-bold">Đáp án đúng: ${q.correctAnswer}</p>
                                            ${q.explanation ? `<p class="text-[11px] text-slate-500 italic mt-1">💡 Lời giải: ${q.explanation}</p>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="text-center">
                            <button onclick="app.navigateTo('student_dashboard')" class="bg-emerald-600 text-white font-bold text-xs px-6 py-2.5 rounded-xl shadow">
                                Quay Về Trang Chủ
                            </button>
                        </div>
                    </div>
                `;
            }

            async renderLeaderboardView() {
                const students = await this.db.getAll('students');
                const attempts = await this.db.getAll('attempts');

                const ranked = students.map(s => {
                    const stdAttempts = attempts.filter(a => a.studentId === s.id);
                    const avg = stdAttempts.length > 0 
                        ? (stdAttempts.reduce((sum, a) => sum + a.score, 0) / stdAttempts.length)
                        : 0;
                    return { student: s, avgScore: avg, count: stdAttempts.length };
                }).sort((a, b) => b.avgScore - a.avgScore);

                return `
                    <div class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <h1 class="text-xl font-bold text-slate-800">🏆 Bảng Xếp Hạng Học Tập</h1>
                            <p class="text-xs text-slate-500">Tuyên dương các học sinh có điểm trung bình thi xuất sắc nhất</p>
                        </div>

                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                            <div class="space-y-2">
                                ${ranked.map((item, idx) => `
                                    <div class="flex items-center justify-between p-3 rounded-xl border ${idx === 0 ? 'bg-amber-50 border-amber-200' : 'bg-slate-50'}">
                                        <div class="flex items-center gap-3">
                                            <span class="font-bold text-sm w-6 text-center ${idx === 0 ? 'text-amber-600' : 'text-slate-400'}">
                                                ${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}
                                            </span>
                                            <span class="font-bold text-xs text-slate-800">${item.student.name}</span>
                                        </div>
                                        <div class="text-right">
                                            <span class="font-bold text-sm text-emerald-600">${item.avgScore.toFixed(1)} đ</span>
                                            <p class="text-[10px] text-slate-400">${item.count} bài thi</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            async renderStudentHistoryView() {
                const attempts = (await this.db.getAll('attempts')).filter(a => a.studentId === this.currentUser.id);

                return `
                    <div class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <h1 class="text-xl font-bold text-slate-800">⏱️ Lịch Sử Làm Bài Cá Nhân</h1>
                        </div>

                        <div class="space-y-2">
                            ${attempts.map(a => `
                                <div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-sm">${a.examTitle}</h4>
                                        <p class="text-xs text-slate-400">${new Date(a.submittedAt).toLocaleString('vi-VN')}</p>
                                    </div>
                                    <span class="font-bold text-emerald-600">${a.score.toFixed(1)} đ</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderGuideView() {
                return `
                    <div class="space-y-6 max-w-3xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 text-xs leading-relaxed text-slate-600">
                            <h2 class="font-bold text-lg text-slate-800">❓ Hướng Dẫn Sử Dụng Ứng Dụng Ôn Thi Công Nghệ 12</h2>
                            
                            <div class="space-y-2">
                                <h3 class="font-bold text-slate-800 text-sm text-emerald-700">Dành Cho Giáo Viên:</h3>
                                <p>1. <strong>Quản lý Lớp & Học Sinh:</strong> Thêm thủ công, nạp file Excel (.xlsx) hoặc dán danh sách tên học sinh trực tiếp.</p>
                                <p>2. <strong>Quản lý Đề & Câu Hỏi:</strong> Tạo câu hỏi trắc nghiệm kèm lời giải. Trích xuất tài liệu Word (.docx) để tạo chuyên đề ôn tập.</p>
                                <p>3. <strong>Giao Đề & Xuất Báo Cáo:</strong> Giao bài thi cho lớp học, tự động chấm điểm và xuất file Excel kết quả tổng hợp.</p>
                            </div>

                            <div class="space-y-2 border-t pt-3">
                                <h3 class="font-bold text-slate-800 text-sm text-teal-700">Dành Cho Học Sinh:</h3>
                                <p>1. <strong>Làm Bài Trực Tuyến:</strong> Bài thi có đồng hồ đếm ngược và tính năng tự động lưu từng câu trả lời vào máy tính.</p>
                                <p>2. <strong>Xem Đáp Án & Lời Giải:</strong> Xem ngay điểm số, câu sai và lời giải giải thích chi tiết sau khi nộp bài.</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize Global App Instance
        const app = new AgriApp();
        window.onload = () => app.start();
    </script>
</body>
</html>
